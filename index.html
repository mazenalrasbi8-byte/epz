<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Practice Zone</title>
<meta name="description" content="Grade 9 English practice games: type your name and play. Points, badges, streaks and a class ranking.">
<meta name="theme-color" content="#0B7A63">
<meta property="og:title" content="English Practice Zone">
<meta property="og:description" content="Grade 9 English games by Mr. Mazen Al-Rasbi. Type your name and play.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='6' y='6' width='52' height='52' rx='14' fill='%23F4A51C'/><rect x='2' y='2' width='52' height='52' rx='14' fill='%230B7A63'/><text x='28' y='42' font-family='Arial' font-weight='700' font-size='34' fill='white' text-anchor='middle'>E</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: one thumb-friendly column (max 560px); while playing, the answer button and feedback sit in a bar fixed to the bottom. */
:root {
  --bg: #EDF3F0;
  --surface: #FFFFFF;
  --surface-2: #F4F8F6;
  --ink: #13232F;
  --muted: #566672;
  --line: #D6E0DC;
  --brand: #0B7A63;
  --brand-deep: #06604D;
  --on-brand: #FFFFFF;
  --sun: #F4A51C;
  --sun-ink: #3A2600;
  --good: #168A3F;
  --good-bg: #DCF5E3;
  --good-ink: #0E5528;
  --bad: #D13A3A;
  --bad-bg: #FCE3E1;
  --bad-ink: #7A1C1C;
  --wa: #128C4A;
  --shadow: 0 1px 2px rgb(19 35 47 / .06), 0 6px 18px rgb(19 35 47 / .07);
  --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --display: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  --r: 20px;
  --r-s: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1618; --surface: #142225; --surface-2: #1A2B2E; --ink: #E5EFEC; --muted: #9AAEAB; --line: #26383C;
    --brand: #158C72; --brand-deep: #0F6E5A; --on-brand: #FFFFFF; --sun: #F6B43C; --sun-ink: #2B1C00;
    --good: #3CC473; --good-bg: #12301F; --good-ink: #AEEDC6; --bad: #F2706A; --bad-bg: #371816; --bad-ink: #FFC4BF;
    --wa: #1E9E5A; --shadow: 0 1px 2px rgb(0 0 0 / .45), 0 8px 22px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1618; --surface: #142225; --surface-2: #1A2B2E; --ink: #E5EFEC; --muted: #9AAEAB; --line: #26383C;
  --brand: #158C72; --brand-deep: #0F6E5A; --on-brand: #FFFFFF; --sun: #F6B43C; --sun-ink: #2B1C00;
  --good: #3CC473; --good-bg: #12301F; --good-ink: #AEEDC6; --bad: #F2706A; --bad-bg: #371816; --bad-ink: #FFC4BF;
  --wa: #1E9E5A; --shadow: 0 1px 2px rgb(0 0 0 / .45), 0 8px 22px rgb(0 0 0 / .25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body.playing { padding-bottom: 210px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--brand); }
svg { display: block; flex-shrink: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.good-text { color: var(--good); }
.bad-text { color: var(--bad); }
.fine { font-size: .85rem; color: var(--muted); }
.eyebrow { font-size: .78rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding-block: 0 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.storage-warning { background: var(--bad-bg); color: var(--bad-ink); font-weight: 800; font-size: .9rem; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; }

/* ------------------------------------------------------------ buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: var(--r-s); padding: 10px 16px; min-height: 44px;
  font-weight: 900; text-decoration: none; cursor: pointer;
  background: var(--surface-2); color: var(--ink);
  transition: transform .08s, filter .15s;
}
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-big { min-height: 56px; font-size: 1.1rem; border-radius: 16px; width: 100%; }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: .9rem; border-radius: 11px; }
.btn-primary { background: var(--brand); color: var(--on-brand); box-shadow: 0 4px 0 var(--brand-deep); }
.btn-primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--brand-deep); }
.btn-ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.btn-bad { background: var(--bad); color: #fff; }
.btn-send { background: var(--sun); color: var(--sun-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--sun) 70%, #000); }
.btn-wa { background: var(--wa); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--wa) 70%, #000); }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.linklike { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 800; text-decoration: underline; cursor: pointer; }

/* ------------------------------------------------------------ welcome */
.welcome-owner { padding-top: 16px; }
.welcome { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding-block: 40px 20px; }
.welcome h1 { font-size: clamp(2.2rem, 9vw, 3rem); font-weight: 800; letter-spacing: -.01em; }
.welcome .eyebrow { color: var(--brand); margin-top: 8px; }
.teacher-line { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); padding: 6px 12px; border-radius: 999px; font-weight: 700; color: var(--muted); box-shadow: var(--shadow); }
.teacher-line b { color: var(--ink); }
.teacher-line svg { color: var(--brand); }
.lead { font-size: 1.12rem; color: var(--muted); max-width: 32ch; }
.skill-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-block: 6px 10px; }
.skill-strip span { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: var(--c); transform: rotate(-4deg); }
.skill-strip span:nth-child(even) { transform: rotate(5deg); }
.name-form { width: 100%; display: flex; flex-direction: column; gap: 10px; background: var(--surface); padding: 20px; border-radius: var(--r); box-shadow: var(--shadow); }
.name-form label { font-family: var(--display); font-size: 1.35rem; font-weight: 700; }
input, textarea {
  width: 100%; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r-s);
  padding: 13px 14px; font-size: 1.1rem; font-weight: 700; outline: none;
}
input:focus, textarea:focus { border-color: var(--brand); }
.form-error { color: var(--bad); font-weight: 800; font-size: .92rem; }
.logo-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--brand); color: var(--on-brand); display: inline-grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.2rem; line-height: 1; padding-top: 3px; box-shadow: 3px 3px 0 var(--sun); }
.logo-mark.big { width: 64px; height: 64px; border-radius: 18px; font-size: 2.4rem; box-shadow: 5px 5px 0 var(--sun); }

/* ------------------------------------------------------------ home */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px; background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 1.05rem; min-width: 0; }
.brand span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pts-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 900; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; }
.pts-chip svg { color: var(--sun); fill: var(--sun); }
.owner-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r-s); font-weight: 800; font-size: .92rem; }
.owner-bar span { flex: 1; min-width: 0; }
.owner-bar .btn { background: var(--sun); color: var(--sun-ink); }

.hello { display: flex; align-items: center; gap: 14px; }
.avatar { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); font-family: var(--display); font-weight: 800; font-size: 1.3rem; cursor: pointer; flex-shrink: 0; padding-top: 2px; }
.hello-txt { min-width: 0; }
.hello h1 { font-size: 1.9rem; font-weight: 800; }
.hello p { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; color: var(--muted); font-weight: 800; font-size: .95rem; }
.lg-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--lg); margin-right: 2px; }
.sep { margin-inline: 4px; }
.ic.flame { color: #E8590C; }

.quick {
  display: flex; align-items: center; gap: 14px;
  background: var(--brand); color: var(--on-brand);
  border-radius: 24px; padding: 20px; position: relative; overflow: hidden;
}
.quick::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 180px; height: 180px; border-radius: 50%; border: 22px solid rgb(255 255 255 / .08); pointer-events: none; }
.quick-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.quick .eyebrow { color: var(--sun); }
.quick h2 { font-size: 1.6rem; font-weight: 800; }
.quick p { opacity: .9; font-weight: 700; }
.goal { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 800; font-size: .88rem; flex-wrap: wrap; }
.goal-dots { display: flex; gap: 5px; }
.goal-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .6); }
.goal-dots i.on { background: var(--sun); border-color: var(--sun); }
.play-btn {
  position: relative; z-index: 1;
  width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
  background: var(--sun); color: var(--sun-ink); text-decoration: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  font-family: var(--display); font-weight: 800; font-size: 1.15rem;
  box-shadow: 0 6px 0 color-mix(in srgb, var(--sun) 65%, #000);
  transition: transform .08s;
  animation: nudge 2.6s ease-in-out infinite;
}
.play-btn svg { fill: currentColor; margin-left: 4px; }
.play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--sun) 65%, #000); }

.block { display: flex; flex-direction: column; gap: 12px; }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.block-head h2 { font-size: 1.4rem; font-weight: 800; }
.level-switch { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
.level-switch button { border: 0; background: transparent; border-radius: 999px; padding: 7px 14px; font-weight: 900; font-size: .92rem; color: var(--muted); cursor: pointer; min-height: 36px; }
.level-switch button[aria-checked="true"] { background: var(--ink); color: var(--bg); }
.suggest { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 2px dashed var(--brand); border-radius: var(--r-s); padding: 10px 14px; font-weight: 700; }
.suggest span { flex: 1; min-width: 0; }
.suggest > svg { color: var(--brand); }

.skill-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.skill-tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
  padding: 16px; border-radius: var(--r); text-decoration: none; color: var(--ink);
  background: var(--surface);
  background: color-mix(in srgb, var(--c) 9%, var(--surface));
  border: 2px solid color-mix(in srgb, var(--c) 22%, var(--surface));
  box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 30%, var(--surface));
  transition: transform .08s;
  min-height: 136px;
}
.skill-tile:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 30%, var(--surface)); }
.skill-tile[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.skill-tile:last-child:nth-child(odd) { grid-column: 1 / -1; flex-direction: row; align-items: center; min-height: 0; }
.skill-tile:last-child:nth-child(odd) .skill-txt { flex: 1; }
.skill-ic { width: 44px; height: 44px; border-radius: 13px; background: var(--c); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.skill-txt { display: flex; flex-direction: column; min-width: 0; }
.skill-name { font-family: var(--display); font-weight: 800; font-size: 1.15rem; line-height: 1.15; }
.skill-sub { color: var(--muted); font-size: .88rem; font-weight: 700; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--c); }
.dots i.on { background: var(--c); }

.me-block { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); gap: 16px; }
.league-row { display: flex; align-items: center; gap: 14px; }
.medal { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--lg); color: #fff; flex-shrink: 0; box-shadow: inset 0 -4px 0 rgb(0 0 0 / .18); }
.league-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.league-txt b { font-family: var(--display); font-size: 1.25rem; }
.league-txt span { color: var(--muted); font-weight: 700; font-size: .92rem; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 6px; border: 1px solid var(--line); }
.bar span { display: block; height: 100%; background: var(--lg, var(--brand)); border-radius: 999px; }
.mini-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.modal .mini-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mini-stats div { background: var(--surface-2); border-radius: var(--r-s); padding: 10px; display: flex; flex-direction: column; align-items: center; }
.mini-stats b { font-family: var(--display); font-size: 1.35rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.mini-stats span { color: var(--muted); font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
details.badges summary { display: flex; align-items: center; gap: 8px; font-weight: 900; cursor: pointer; list-style: none; padding-block: 4px; }
details.badges summary::-webkit-details-marker { display: none; }
details.badges summary::after { content: "Show"; margin-left: auto; color: var(--brand); font-size: .9rem; }
details.badges[open] summary::after { content: "Hide"; }
.badge-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.badge { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; padding: 10px; border-radius: var(--r-s); background: var(--surface-2); color: var(--muted); }
.badge .badge-ic { grid-row: span 2; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--muted); }
.badge b { font-size: .92rem; line-height: 1.2; }
.badge small { font-size: .76rem; line-height: 1.25; }
.badge.earned { color: var(--ink); background: color-mix(in srgb, var(--sun) 16%, var(--surface)); }
.badge.earned .badge-ic { background: var(--sun); color: var(--sun-ink); }

.board { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.board-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.board-list li { border-radius: 12px; background: var(--surface-2); font-weight: 800; }
.board-list li > .peer, .board-list li > .rk { }
.peer { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border: 0; background: none; color: inherit; font: inherit; text-align: left; border-radius: 12px; cursor: pointer; min-height: 48px; }
.peer .nm small { display: block; font-weight: 600; font-size: .78rem; color: var(--muted, #6b7280); }
.peer-h { margin: 14px 0 6px; font-size: 1rem; }
.peer-sk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.peer-sk li { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 8px; font-size: .9rem; }
.peer-sk .bar { height: 8px; }
.peer-sk .bar > span { background: var(--lg); }
.peer-sk b { text-align: right; font-variant-numeric: tabular-nums; }
.peer-cmp { margin: 12px 0; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-weight: 700; }
.board-list li.me { background: color-mix(in srgb, var(--brand) 16%, var(--surface)); outline: 2px solid var(--brand); }
.board-list li em { color: var(--brand); font-style: normal; }
.board-list .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.board-list .pt { font-variant-numeric: tabular-nums; }
.rk { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: .9rem; background: var(--line); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.rk-1 { background: #E8B21E; color: #3A2600; }
.rk-2 { background: #A9B4C0; color: #1F2933; }
.rk-3 { background: #C98B53; color: #2E1704; }
.board-list.mine { border-top: 2px dashed var(--line); padding-top: 8px; }
.board-list.compact li { padding: 5px 10px; font-size: .92rem; display: flex; gap: 12px; }
.foot { text-align: center; color: var(--muted); font-size: .85rem; padding-top: 8px; line-height: 1.6; }
.foot b { color: var(--ink); }

/* ------------------------------------------------------------ my dashboard */
a.pts-chip { color: var(--ink); text-decoration: none; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding-inline: 4px 12px; color: var(--ink); font-weight: 900; text-decoration: none; border-radius: 12px; }
.dash-link { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; text-decoration: none; padding: 8px; }
.dash-hero { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
.dh-id { display: flex; align-items: center; gap: 14px; }
.dh-name { min-width: 0; }
.dh-name .eyebrow { color: var(--brand); }
.dh-name h1 { font-size: 1.7rem; font-weight: 800; overflow-wrap: anywhere; }
.dh-name p:last-child { color: var(--muted); font-weight: 700; font-size: .95rem; }
.dh-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.dh-stats div { background: var(--surface-2); border-radius: var(--r-s); padding: 10px 6px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.dh-stats b { font-family: var(--display); font-size: 1.6rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.dh-stats span { color: var(--muted); font-size: .78rem; font-weight: 800; line-height: 1.2; }
.dh-league { display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-weight: 800; font-size: .9rem; }

.dash-card { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.dash-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.dash-head h2 { font-size: 1.3rem; font-weight: 800; }
.dash-big { font-weight: 800; color: var(--ink); }
.dash-big b { font-family: var(--display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; margin-right: 2px; }
.dash-big .muted { font-size: .9rem; }

.week-chart { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; border-bottom: 1px solid var(--line); }
.wc { border: 0; background: transparent; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: stretch; gap: 6px; color: var(--muted); border-radius: 10px; }
.wc-plot { height: 130px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.wc-val { font-size: .78rem; font-weight: 900; color: var(--ink); font-variant-numeric: tabular-nums; min-height: 1em; }
.wc-bar { width: min(28px, 70%); background: var(--brand); border-radius: 4px 4px 0 0; }
.wc-bar.zero { height: 2px !important; background: var(--line); border-radius: 1px; }
.wc-lbl { font-size: .78rem; font-weight: 800; text-align: center; padding-bottom: 6px; }
.wc.today .wc-lbl { color: var(--ink); }
.wc.today .wc-bar:not(.zero) { background: var(--sun); }
.wc.picked .wc-lbl { color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }
@media (hover: hover) { .wc:hover .wc-bar:not(.zero) { filter: brightness(1.1); } }
.wc-cap { color: var(--muted); font-weight: 700; font-size: .92rem; }

.sk-tips { display: flex; flex-direction: column; gap: 8px; }
.tip { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-s); font-weight: 700; background: var(--surface-2); }
.tip span { flex: 1; min-width: 0; }
.tip.good > svg { color: var(--sun); }
.tip.next > svg { color: var(--brand); }
.sk-list { display: flex; flex-direction: column; gap: 14px; }
.sk-row { display: flex; gap: 12px; align-items: flex-start; }
.skill-ic.sm { width: 36px; height: 36px; border-radius: 11px; }
.sk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.sk-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sk-top b { font-size: 1.02rem; }
.sk-acc { font-family: var(--display); font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sk-acc small { font-family: var(--font); font-size: .78rem; color: var(--muted); font-weight: 800; }
.sk-acc .muted { font-family: var(--font); font-size: .85rem; font-weight: 700; }
.sk-bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.sk-bar span { display: block; height: 100%; background: var(--c); border-radius: 999px; }
.sk-sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: .82rem; font-weight: 700; }
.sk-levels { display: flex; gap: 4px; flex-wrap: wrap; }
.lv { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: .74rem; font-weight: 800; white-space: nowrap; }
.lv.part { border-color: var(--c); color: var(--ink); }
.lv.full { background: var(--c); border-color: var(--c); color: #fff; }

.recent { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.recent li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.rc-ic { width: 32px; height: 32px; border-radius: 10px; background: var(--c); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.rc-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.rc-txt b { font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-txt span { color: var(--muted); font-size: .8rem; font-weight: 700; }
.rc-score { font-weight: 900; font-variant-numeric: tabular-nums; }
.rc-pts { font-weight: 900; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }

/* ------------------------------------------------------------ play */
.play { --c: var(--brand); display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.play-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; background: var(--bg); padding-block: 8px; }
.pbar { flex: 1; height: 16px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); overflow: hidden; }
.pbar span { display: block; height: 100%; width: 0; background: var(--c); border-radius: 999px; transition: width .35s ease; }
.play-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-weight: 800; font-size: .92rem; }
.skill-pill { display: inline-flex; align-items: center; gap: 6px; color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface)); padding: 4px 10px; border-radius: 999px; font-weight: 900; }
.passage { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.passage summary { padding: 14px 16px; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--c); }
.passage-text { padding: 0 18px 18px; font-size: 1.05rem; line-height: 1.7; }
.audio-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.audio-ic { width: 44px; height: 44px; border-radius: 13px; background: var(--c); color: #fff; display: grid; place-items: center; }
.audio-txt { flex: 1; min-width: 150px; display: flex; flex-direction: column; }
.audio-txt span { color: var(--muted); font-size: .88rem; }

.qarea { --t: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.qarea.enter { animation: slideIn .28s ease; }
.q-prompt { font-family: var(--font); font-weight: 800; font-size: clamp(1.3rem, 5.4vw, 1.6rem); line-height: 1.38; margin-bottom: 18px; overflow-wrap: anywhere; }
.q-prompt.small-prompt { font-size: 1.05rem; color: var(--muted); margin-bottom: 12px; }
.blank { display: inline-block; min-width: 64px; border-bottom: 3px solid var(--c); color: transparent; line-height: 1; }
.q-label { display: flex; align-items: center; gap: 8px; color: var(--c); font-weight: 900; margin-bottom: 8px; }
.q-image { font-size: 60px; line-height: 1; margin-bottom: 10px; }
.q-audio { margin: -6px 0 14px; }
.options { display: grid; gap: 10px; }
.options.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left; min-height: 60px;
  padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface);
  cursor: pointer; font-weight: 800; font-size: 1.08rem; box-shadow: 0 4px 0 var(--line);
  transition: transform .08s, border-color .15s, background .15s; overflow-wrap: anywhere;
}
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
@media (hover: hover) { .opt:hover:not(:disabled) { border-color: var(--c); background: var(--t); } }
.opt:disabled { cursor: default; }
.opt-key { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-size: .82rem; font-weight: 900; flex-shrink: 0; }
.opt.correct { border-color: var(--good); background: var(--good-bg); box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 45%, var(--surface)); animation: pop .35s ease; }
.opt.correct .opt-key { background: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 45%, var(--surface)); animation: shake .4s ease; }
.opt.wrong .opt-key { background: var(--bad); color: #fff; }
.answer-field { display: block; }
.answer-input.correct { border-color: var(--good); background: var(--good-bg); }
.answer-input.wrong { border-color: var(--bad); background: var(--bad-bg); animation: shake .4s ease; }
.tile-target { min-height: 64px; border: 3px dashed var(--line); border-radius: 16px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 14px; background: var(--surface-2); }
.tile-target.correct { border-style: solid; border-color: var(--good); background: var(--good-bg); }
.tile-target.wrong { border-style: solid; border-color: var(--bad); background: var(--bad-bg); animation: shake .4s ease; }
.tile-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; min-height: 48px; }
.tile-target.vertical, .tile-pool.vertical { flex-direction: column; align-items: stretch; }
.tile { padding: 10px 14px; min-height: 46px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 800; font-size: 1.05rem; cursor: pointer; box-shadow: 0 3px 0 var(--line); text-align: left; display: flex; align-items: center; gap: 10px; animation: pop .2s ease; overflow-wrap: anywhere; }
.tile.placed { border-color: var(--c); background: var(--t); box-shadow: 0 3px 0 var(--c); }
.tile.correct { border-color: var(--good); background: var(--good-bg); box-shadow: 0 3px 0 var(--good); }
.tile.wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 3px 0 var(--bad); }
.tile-num { width: 26px; height: 26px; border-radius: 8px; background: var(--c); color: #fff; display: grid; place-items: center; font-size: .8rem; flex-shrink: 0; }
.placeholder { padding: 6px 8px; font-weight: 700; }
#tiles-reset { min-height: 40px; }
.match-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.match-col { display: flex; flex-direction: column; gap: 8px; }
.match-col + .match-col { border-top: 2px dashed var(--line); padding-top: 14px; }
.match-item { --m: var(--line); padding: 11px 14px; min-height: 48px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 800; cursor: pointer; text-align: left; box-shadow: 0 3px 0 var(--line); overflow-wrap: anywhere; }
.match-item.selected { border-color: var(--c); background: var(--t); box-shadow: 0 0 0 4px var(--t); }
.match-item.paired { border-color: var(--m); box-shadow: 0 3px 0 var(--m); border-left-width: 8px; }
.match-item.correct { background: var(--good-bg); border-color: var(--good); }
.match-item.wrong { background: var(--bad-bg); border-color: var(--bad); animation: shake .4s ease; }

.play-foot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--surface); border-top: 2px solid var(--line);
  padding-block: 14px max(14px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: background .2s;
}
.foot-inner { max-width: 528px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.play-foot.good { background: var(--good-bg); border-top-color: var(--good); }
.play-foot.bad { background: var(--bad-bg); border-top-color: var(--bad); }
.play-foot .btn-primary { background: var(--c); box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 65%, #000); }
.btn-next { color: #fff; }
.play-foot.good .btn-next { background: var(--good); box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 65%, #000); }
.play-foot.bad .btn-next { background: var(--bad); box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 65%, #000); }
.feedback { display: flex; gap: 12px; align-items: flex-start; animation: fadeUp .22s ease; max-height: 38vh; overflow-y: auto; }
.play-foot.good .feedback { color: var(--good-ink); }
.play-foot.bad .feedback { color: var(--bad-ink); }
.fb-ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex-shrink: 0; }
.play-foot.good .fb-ic { background: var(--good); }
.play-foot.bad .fb-ic { background: var(--bad); }
.fb-txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.fb-txt strong { font-family: var(--display); font-size: 1.35rem; line-height: 1.2; }

/* ------------------------------------------------------------ results */
.results { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding-block: 32px 8px; }
.results h1 { font-size: 2rem; font-weight: 800; margin-top: 6px; }
.ring { --p: 0; width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--line) 0); }
.ring > span { width: 118px; height: 118px; border-radius: 50%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring b { font-family: var(--display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ring small { color: var(--muted); font-weight: 800; }
.earned-pts { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 1.6rem; background: var(--surface); padding: 8px 18px; border-radius: 999px; box-shadow: var(--shadow); }
.earned-pts svg { color: var(--sun); fill: var(--sun); }
.res-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.res-chips span { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: .9rem; }
.unlock { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border-radius: var(--r-s); padding: 12px 14px; box-shadow: var(--shadow); animation: pop .35s ease; }
.unlock > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.unlock span:not(.medal):not(.badge-ic) { color: var(--muted); font-size: .9rem; }
.unlock .medal { width: 44px; height: 44px; }
.unlock .badge-ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: var(--sun-ink); flex-shrink: 0; }
.unlock.level-up > svg { color: var(--brand); }
.res-actions { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

/* ------------------------------------------------------------ sheets, toasts */
.modal-backdrop { position: fixed; inset: 0; background: rgb(8 16 20 / .55); z-index: 80; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease; }
.modal {
  position: relative; background: var(--surface); width: min(100%, 560px); max-height: 90vh; overflow-y: auto;
  border-radius: 24px 24px 0 0; padding-block: 24px max(22px, env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  animation: sheetUp .22s ease;
}
.modal-wide { width: min(100%, 640px); }
@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 16px; }
  .modal { border-radius: 24px; padding: 26px; }
}
.modal-body { display: flex; flex-direction: column; gap: 14px; }
.modal-close { position: absolute; right: 10px; top: 10px; }
.modal-title { display: flex; align-items: center; gap: 8px; padding-right: 40px; font-size: 1.45rem; font-weight: 800; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack > label { font-weight: 900; }
.msg-box { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: .95rem; font-weight: 600; resize: none; background: var(--surface-2); }
.sheet-actions { display: flex; flex-direction: column; gap: 10px; }
details.danger summary { cursor: pointer; color: var(--bad); font-weight: 800; padding-block: 6px; }
details.danger[open] { display: flex; flex-direction: column; gap: 10px; }
.file-pick { display: flex; align-items: center; gap: 8px; color: var(--brand); font-weight: 800; cursor: pointer; font-size: .95rem; }
.file-pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file-pick:focus-within { outline: 3px solid var(--sun); border-radius: 8px; }
.check-row { display: flex; gap: 10px; align-items: flex-start; font-weight: 700; font-size: .95rem; }
.check-row input { width: 22px; height: 22px; flex-shrink: 0; accent-color: var(--brand); margin-top: 2px; }
.tc-preview { display: flex; flex-direction: column; gap: 8px; }
.tc-preview .board-list { max-height: 260px; overflow-y: auto; }

.toasts { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 90; width: min(92vw, 420px); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 800; box-shadow: var(--shadow); animation: fadeDown .25s ease; }
.toast-success { background: var(--good); color: #fff; }
.toast-error { background: var(--bad); color: #fff; }
.toast.out { opacity: 0; transform: translateY(-8px); transition: .3s; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 95; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall linear forwards; }

@keyframes slideIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
@keyframes nudge { 0%, 85%, 100% { transform: scale(1); } 92% { transform: scale(1.06); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .confetti { display: none; }
}
@media (max-width: 360px) {
  .options.grid-2 { grid-template-columns: minmax(0, 1fr); }
  .play-btn { width: 82px; height: 82px; }
  .quick h2 { font-size: 1.35rem; }
}
@media (min-width: 640px) {
  .match-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
  .match-col + .match-col { border-top: 0; padding-top: 0; }
}

/* home: progress entry card */
.prog-card { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); text-decoration: none; color: var(--ink); min-height: 64px; }
.prog-ic { width: 44px; height: 44px; border-radius: 14px; background: var(--brand); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.prog-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.prog-txt b { font-family: var(--display); font-size: 1.15rem; line-height: 1.2; }
.prog-txt span { color: var(--muted); font-weight: 700; font-size: .9rem; }
.prog-go { color: var(--brand); font-weight: 900; }

/* live class ranking (web build) */
.live-pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--good); }
.live-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.board-note { font-weight: 700; }

/* ------------------------------------------------------------ Word of the Day */
.ipa { font-family: 'Noto Sans', 'Segoe UI', 'Lucida Sans Unicode', 'Arial Unicode MS', system-ui, sans-serif; font-weight: 500; letter-spacing: .01em; white-space: nowrap; }
.ipa b { font-weight: 800; color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, transparent); border-radius: 6px; padding: 0 3px; }
.pos-chip, .lv-chip { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 900; letter-spacing: .02em; white-space: nowrap; }
.pos-chip { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); font-style: italic; }
.lv-chip { color: #fff; }
.lv-chip.lv-B { background: #0B8F63; }
.lv-chip.lv-I { background: #1D5FD6; }
.lv-chip.lv-A { background: #6C4CE0; }
.say.on { animation: sayPulse 1s ease-in-out infinite; }
.say-round { width: 52px; height: 52px; min-height: 52px; padding: 0; border-radius: 50%; flex-shrink: 0; background: var(--sun); color: var(--sun-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--sun) 65%, #000); }
.say-round:active:not(:disabled) { box-shadow: 0 1px 0 color-mix(in srgb, var(--sun) 65%, #000); }
@keyframes sayPulse { 0%, 100% { filter: none; } 50% { filter: brightness(1.18); transform: scale(1.04); } }
.w-dots { display: inline-flex; gap: 4px; }
.w-dots i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--brand); }
.w-dots i.on { background: var(--brand); }

/* home card */
.wotd-home { background: var(--surface); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; border-top: 5px solid var(--sun); animation: fadeUp .3s ease; }
.wh-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.wh-head .eyebrow { display: inline-flex; align-items: center; gap: 6px; color: var(--brand); }
.wh-date { color: var(--muted); font-weight: 800; font-size: .85rem; }
.wh-main { display: flex; align-items: center; gap: 12px; }
.wh-txt { flex: 1; min-width: 0; }
.wotd-home h2 { font-size: clamp(1.9rem, 8vw, 2.3rem); font-weight: 800; line-height: 1.05; overflow-wrap: anywhere; }
.wh-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 4px; color: var(--muted); }
.wh-def { color: var(--ink); font-weight: 700; }
.wh-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.wh-prog { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 800; font-size: .88rem; }
.wh-prog > span:last-child { display: inline-flex; align-items: center; gap: 4px; }
.wh-go { background: var(--brand); color: var(--on-brand); box-shadow: 0 3px 0 var(--brand-deep); }

/* word page */
.app.wide { max-width: 560px; }
.wotd-page { display: flex; flex-direction: column; gap: 16px; }
.wcol { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.word-hero { background: var(--brand); color: var(--on-brand); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.word-hero::after { content: ""; position: absolute; right: -50px; top: -60px; width: 190px; height: 190px; border-radius: 50%; border: 24px solid rgb(255 255 255 / .08); pointer-events: none; }
.word-hero .eyebrow { color: var(--sun); }
.word-hero .wh-date { color: rgb(255 255 255 / .85); }
.word-hero h1 { font-size: clamp(2.6rem, 12vw, 3.6rem); font-weight: 800; line-height: 1; overflow-wrap: anywhere; position: relative; z-index: 1; }
.hero-sub { display: flex; align-items: center; gap: 8px; font-size: 1.25rem; }
.word-hero .ipa b { color: var(--sun-ink); background: var(--sun); }
.us-tag { font-size: .7rem; font-weight: 900; letter-spacing: .08em; border: 2px solid rgb(255 255 255 / .6); border-radius: 6px; padding: 0 5px; }
.hero-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.word-hero .pos-chip { background: rgb(255 255 255 / .16); color: #fff; border-color: rgb(255 255 255 / .3); }
.hero-say, .pron-btns { display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
.hero-say .btn-primary { background: var(--sun); color: var(--sun-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--sun) 65%, #000); }
.hero-say .btn-ghost { background: rgb(255 255 255 / .12); color: #fff; border-color: rgb(255 255 255 / .35); }
.hero-def { margin: 4px 0 0; background: var(--surface); color: var(--ink); border-radius: 16px; padding: 4px 14px; }
.hero-def div { padding: 10px 0; display: flex; flex-direction: column; gap: 2px; }
.hero-def div + div { border-top: 1px solid var(--line); }
.hero-def dt, .w-lbl { font-size: .74rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hero-def dd { margin: 0; font-weight: 800; font-size: 1.08rem; }
.ar-row dd { font-family: 'Noto Naskh Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif; font-size: 1.3rem; font-weight: 700; }
.ar-row dt { text-align: left; }
.w-info mark, .w-ex mark, .w-col mark { background: color-mix(in srgb, var(--sun) 40%, transparent); color: inherit; border-radius: 4px; padding: 0 2px; font-weight: 900; }
.w-example { background: var(--surface-2); border-left: 5px solid var(--sun); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.w-example p { font-size: 1.08rem; font-weight: 700; line-height: 1.55; }
.w-row { display: flex; flex-direction: column; gap: 6px; }
.w-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.w-chip { border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: .95rem; }
.w-chip.syn { background: var(--good-bg); color: var(--good-ink); }
.w-chip.ant { background: var(--bad-bg); color: var(--bad-ink); }
.w-col { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.w-col li { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-weight: 700; }
.pron .dash-head h2 { display: inline-flex; align-items: center; gap: 8px; }
.pron-word { display: flex; justify-content: center; padding: 8px 0 0; }
.syls { display: inline-flex; align-items: baseline; flex-wrap: wrap; justify-content: center; gap: 2px 4px; font-family: var(--display); font-size: clamp(1.8rem, 8vw, 2.4rem); font-weight: 700; color: var(--muted); }
.syls i { font-style: normal; color: var(--line); }
.syl { padding: 0 4px; border-radius: 10px; }
.syl.stress { color: var(--ink); background: color-mix(in srgb, var(--sun) 35%, transparent); font-weight: 800; font-size: 1.15em; box-shadow: inset 0 -4px 0 var(--sun); }
.pron-ipa { text-align: center; font-size: 1.3rem; }
.pron-steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
.stress-word { font-weight: 900; background: color-mix(in srgb, var(--sun) 35%, transparent); border-radius: 6px; padding: 0 4px; }
.pron-btns .btn { flex: 1; min-width: 120px; }
.prac-score { font-weight: 800; color: var(--muted); }
.prac-score b { font-family: var(--display); font-size: 1.3rem; color: var(--ink); }
.prac-prog { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: .9rem; color: var(--muted); }
.prac-prog .pbar { --c: var(--brand); }
.prac-tip { display: flex; align-items: flex-start; gap: 8px; font-size: .92rem; font-weight: 700; color: var(--muted); }
.prac-tip svg { color: var(--sun); fill: var(--sun); margin-top: 3px; }
.day-done { display: flex; align-items: center; gap: 12px; background: var(--good-bg); color: var(--good-ink); border-radius: var(--r-s); padding: 12px 14px; animation: pop .35s ease; }
.day-done > svg { width: 36px; height: 36px; padding: 7px; border-radius: 50%; background: var(--good); color: #fff; }
.day-done div { display: flex; flex-direction: column; }
.day-done span { font-size: .9rem; font-weight: 700; }
.act-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.act-tile { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; text-decoration: none; color: var(--ink); background: color-mix(in srgb, var(--c) 8%, var(--surface)); border: 2px solid color-mix(in srgb, var(--c) 22%, var(--surface)); box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 28%, var(--surface)); transition: transform .08s; }
.act-tile:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 28%, var(--surface)); }
.act-tile.done { background: var(--surface); border-color: var(--line); box-shadow: 0 3px 0 var(--line); }
.act-ic { width: 38px; height: 38px; border-radius: 12px; background: var(--c); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.act-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.act-txt b { font-size: 1rem; line-height: 1.25; }
.act-txt > span { color: var(--muted); font-size: .85rem; font-weight: 700; }
.act-n { color: var(--muted); }
.act-state { display: inline-flex; align-items: center; gap: 3px; border-radius: 999px; padding: 4px 9px; font-size: .8rem; font-weight: 900; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.act-state.good { background: var(--good-bg); color: var(--good-ink); }
.act-state.try { background: color-mix(in srgb, var(--sun) 25%, var(--surface)); color: var(--sun-ink); }
.act-state.new { background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .act-state.try { color: var(--sun); } }

/* activity screen */
.w-mini { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border-radius: var(--r-s); padding: 10px 14px; box-shadow: var(--shadow); }
.w-mini b { font-family: var(--display); font-size: 1.5rem; margin-right: 6px; }
.w-mini .say-round { width: 44px; height: 44px; min-height: 44px; }
.practice-note { display: flex; align-items: center; gap: 8px; background: var(--good-bg); color: var(--good-ink); border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: .9rem; }
.wplay .audio-box .btn-primary { background: var(--c); box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 65%, #000); }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 12px 8px; margin: 6px 0 14px; border: 3px dashed var(--line); border-radius: 16px; background: var(--surface-2); }
.slot { width: 42px; height: 50px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.5rem; text-transform: lowercase; }
button.slot { cursor: pointer; border-color: var(--c); box-shadow: 0 3px 0 var(--c); animation: pop .2s ease; }
.slots.correct { border-style: solid; border-color: var(--good); background: var(--good-bg); }
.slots.correct .slot { border-color: var(--good); box-shadow: 0 3px 0 var(--good); }
.slots.wrong { border-style: solid; border-color: var(--bad); background: var(--bad-bg); animation: shake .4s ease; }
.letters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; min-height: 52px; }
.letter { width: 48px; height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-family: var(--display); font-weight: 800; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 0 var(--line); animation: pop .2s ease; }
.letter:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
@media (max-width: 360px) { .slot { width: 34px; height: 44px; font-size: 1.25rem; } .letter { width: 42px; height: 46px; } }
.checks { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.checks li { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .92rem; color: var(--muted); }
.checks li svg { width: 22px; height: 22px; padding: 3px; border-radius: 50%; background: var(--surface-2); flex-shrink: 0; }
.checks li.ok { color: var(--good-ink); }
.checks li.ok svg { background: var(--good); color: #fff; }
.checks li.no { color: var(--bad-ink); }
.checks li.no svg { background: var(--bad); color: #fff; }
.w-tips { background: var(--surface); border-radius: var(--r-s); padding: 10px 14px; box-shadow: var(--shadow); }
.w-tips summary { display: flex; align-items: center; gap: 6px; font-weight: 900; cursor: pointer; color: var(--c); }
.w-tips summary svg { color: var(--sun); fill: var(--sun); }
.w-tips ul { margin: 8px 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: .95rem; }
.w-ex { display: flex; flex-direction: column; gap: 2px; background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-weight: 700; }
.fin-list { list-style: none; margin: 4px 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.fin-list li { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 8px 12px; font-weight: 800; text-align: left; box-shadow: var(--shadow); }
.fin-list li span:nth-child(2) { flex: 1; }
.fin-list .act-ic { width: 30px; height: 30px; border-radius: 9px; }

/* Previous Words */
.arch-head { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.arch-head .eyebrow { display: inline-flex; align-items: center; gap: 6px; color: var(--brand); }
.arch-head h1 { font-size: 2rem; font-weight: 800; }
.arch-today { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--brand); color: var(--on-brand); text-decoration: none; border-radius: var(--r-s); padding: 12px 16px; }
.arch-today .eyebrow { color: var(--sun); }
.arch-today b { font-family: var(--display); font-size: 1.4rem; flex: 1; }
.arch-today-p { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: .88rem; }
.arch-today .w-dots i { border-color: var(--sun); }
.arch-today .w-dots i.on { background: var(--sun); }
.arch-tools { display: flex; flex-direction: column; gap: 10px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-s); padding: 0 12px; color: var(--muted); }
.search:focus-within { border-color: var(--brand); }
.search input { border: 0; padding: 12px 0; background: transparent; font-size: 1.05rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex-shrink: 0; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; min-height: 38px; font-weight: 900; font-size: .88rem; color: var(--muted); cursor: pointer; }
.chips button[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.arch-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.arch-card { position: relative; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); animation: fadeUp .25s ease; }
.arch-link { display: flex; flex-direction: column; gap: 6px; padding: 14px 70px 14px 16px; color: var(--ink); text-decoration: none; min-height: 100%; }
.arch-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.arch-top b { font-family: var(--display); font-size: 1.45rem; line-height: 1.1; }
.arch-meta { color: var(--muted); font-weight: 700; font-size: .9rem; }
.arch-def { font-weight: 700; font-size: .95rem; }
.arch-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 2px; color: var(--muted); font-weight: 800; font-size: .85rem; }
.arch-p { display: inline-flex; align-items: center; gap: 6px; }
.arch-card .say-round { position: absolute; right: 14px; top: 14px; width: 44px; height: 44px; min-height: 44px; }
.arch-none { padding: 18px; text-align: center; background: var(--surface); border-radius: var(--r); }
.arch-empty { flex-direction: row; align-items: center; color: var(--muted); }
.arch-empty svg { color: var(--brand); }

@media (min-width: 760px) {
  .app.wide { max-width: 1040px; }
  .wotd-page { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .wcol-side { position: sticky; top: 76px; }
  .arch-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .arch-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .arch-tools .search { grid-column: 1 / -1; }
}
@media (min-width: 1000px) {
  .arch-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .word-hero { padding: 26px; }
}

/* ------------------------------------------------------------ grade and class setup (epz-patch:classes) */
.setup-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding-top: 8px; }
.setup-top .back-btn { background: none; border: 0; font: inherit; font-weight: 900; cursor: pointer; }
.su-steps { display: flex; gap: 6px; }
.su-steps i { width: 26px; height: 6px; border-radius: 99px; background: var(--line); transition: background .2s; }
.su-steps i.on { background: var(--brand); }
.setup { display: flex; flex-direction: column; gap: 14px; padding-block: 4px 28px; }
.school-line { margin-bottom: -6px; }
.setup > .logo-mark, .setup > .teacher-line, .setup > .skill-strip, .setup > .su-pick { align-self: flex-start; }
.setup h1 { font-size: clamp(2rem, 8vw, 2.6rem); font-weight: 800; letter-spacing: -.01em; }
.su-q { font-family: var(--display); font-size: 1.6rem; font-weight: 800; line-height: 1.15; margin-top: 4px; }
.su-eyebrow { color: var(--brand); margin-bottom: -10px; }
.su-grid { display: grid; gap: 10px; }
.su-grades { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.su-classes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.su-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 80px; padding: 12px; border: 2px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font: inherit; cursor: pointer; transition: transform .08s, border-color .15s, background .15s; }
.su-card b { font-family: var(--display); font-size: 2rem; font-weight: 800; line-height: 1; }
.su-card small { color: var(--muted); font-weight: 900; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
.su-classes .su-card { min-height: 64px; }
.su-classes .su-card b { font-size: 1.5rem; }
.su-card:active { transform: translateY(2px); }
.su-card.on, .su-card:focus-visible { border-color: var(--brand); outline: none; background: color-mix(in srgb, var(--brand) 10%, var(--surface)); }
.su-guest { flex-direction: row; gap: 10px; min-height: 60px; font-weight: 900; font-size: 1.05rem; border-style: dashed; box-shadow: none; }
.su-guest svg, .su-pick svg { color: var(--brand); }
.su-pick { display: inline-flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--brand) 12%, var(--surface)); padding: 8px 14px; border-radius: 999px; font-weight: 900; }
.name-form .su-lbl { font-family: var(--font); font-size: .95rem; font-weight: 900; margin-top: 2px; }
.su-fwd { animation: suFwd .28s ease both; }
.su-back { animation: suBack .28s ease both; }
@keyframes suFwd { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes suBack { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
.class-chip { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 3px 4px 3px 12px; font: inherit; font-weight: 900; font-size: .88rem; cursor: pointer; }
.class-chip span { background: var(--surface-2); color: var(--brand); border-radius: 999px; padding: 3px 10px; font-size: .8rem; }
.cls-tag { font-weight: 900; color: var(--ink); margin-right: 6px; }
.me-info { display: flex; flex-direction: column; gap: 2px; background: var(--surface-2); border-radius: var(--r-s); padding: 12px 14px; }
.me-info b { font-size: 1.1rem; }
.me-info span { color: var(--muted); font-weight: 800; }
@media (prefers-reduced-motion: reduce) { .su-fwd, .su-back { animation: none !important; } }
