<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B7A63">
<title>EPZ Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4F1;--surface:#fff;--surface-2:#F5F9F7;--ink:#13232F;--muted:#5A6B66;--faint:#8A9A95;--line:#DCE6E2;--green:#0B7A63;--green-d:#08594A;--green-l:#E5F4EE;--amber:#F4A51C;--amber-ink:#8A5300;--bad:#C53030;--bad-bg:#FDECEC;--blue:#2F6FED;--red:#E5484D;--shadow:0 2px 0 rgb(19 35 47/.06),0 8px 24px rgb(19 35 47/.06);--r:18px}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1A;--surface:#172625;--surface-2:#1C2D2C;--ink:#EAF2EF;--muted:#9DB3AD;--faint:#6F8781;--line:#27403C;--green:#2FB896;--green-d:#1E8F73;--green-l:#183530;--amber-ink:#F4C35C;--bad:#FF8A8A;--bad-bg:#3A1F1F;--shadow:0 2px 0 rgb(0 0 0/.3)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,Arial,sans-serif;font-weight:700;line-height:1.35;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 40px}
h1,h2,h3{font-family:'Baloo 2','Nunito',sans-serif;margin:0;line-height:1.1}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;box-shadow:3px 3px 0 var(--amber);flex-shrink:0;padding-top:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top small{display:block;color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.02em}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.login{margin:12vh auto 0;max-width:440px;display:flex;flex-direction:column;gap:12px}
label{font-weight:800;font-size:.92rem}
input[type=text],input[type=password],input[type=search],select{width:100%;font:inherit;font-weight:800;font-size:1rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--green)}
.btn{font:inherit;font-weight:900;border:0;border-radius:14px;padding:12px 16px;background:var(--green);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--green-d);min-height:44px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-d)}
.btn[disabled]{opacity:.55}
.btn-ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none;padding:8px 12px;min-height:40px;font-size:.9rem}
.btn-bad{background:var(--bad);color:#fff;box-shadow:0 3px 0 rgb(0 0 0/.25)}
.btn-link{background:none;border:0;color:var(--green);font:inherit;font-weight:900;cursor:pointer;padding:4px 0}
.err{color:var(--bad);background:var(--bad-bg);border-radius:12px;padding:10px 12px;font-size:.92rem}
.note{color:var(--muted);font-size:.86rem;margin:0 2px 12px;background:var(--surface);border-left:4px solid var(--amber);border-radius:10px;padding:10px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-weight:900;font-size:.86rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;background:var(--surface);padding:5px;border-radius:16px;box-shadow:var(--shadow);margin:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;font:inherit;font-weight:900;font-size:.88rem;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected=true]{background:var(--green);color:#fff}
.tab .cnt{background:var(--red);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 6px}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
@media(min-width:900px){.grid.two{grid-template-columns:1.25fr 1fr;align-items:start}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.kpis.six{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px;text-align:left;border:0;font:inherit;color:inherit;cursor:default}
.kpi.click{cursor:pointer}
.kpi b{display:block;font-family:'Baloo 2',sans-serif;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{display:block;color:var(--muted);font-size:.82rem;font-weight:800;margin-top:4px}
.kpi small{display:block;color:var(--faint);font-size:.74rem;font-weight:700;margin-top:2px}
.kpi.good b{color:var(--green)}
.kpi.warn b{color:var(--amber-ink)}
.sec{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h small{color:var(--muted);font-weight:700;font-size:.8rem}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mini li:last-child{border-bottom:0}
.mini .nm{flex:1;min-width:0}
.mini .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .nm small{color:var(--muted);font-weight:700;font-size:.8rem}
.mini .val{font-family:'Baloo 2',sans-serif;font-size:1.15rem;color:var(--green);white-space:nowrap}
.rk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:900;background:var(--surface-2);color:var(--muted);flex-shrink:0}
.rk.r1{background:#FACC15;color:#5A3A00}.rk.r2{background:#CBD5E1;color:#334155}.rk.r3{background:#E8A26B;color:#5A2A00}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:.9rem;color:#fff;background:var(--green);flex-shrink:0}
.av.big{width:56px;height:56px;font-size:1.3rem}
.row{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:11px 10px 11px 12px;display:flex;align-items:center;gap:10px}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;background:var(--line)}
.dot.on{background:#1FA97C;box-shadow:0 0 0 3px rgb(31 169 124/.2)}
.dot.idle{background:var(--amber)}
.who{flex:1;min-width:0;cursor:pointer;background:none;border:0;font:inherit;color:inherit;text-align:left;padding:0}
.who b{display:block;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .sub{display:block;color:var(--muted);font-size:.82rem;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.on{background:var(--green-l);color:var(--green);border-color:transparent}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tag.cls{background:var(--ink);color:var(--bg);border-color:transparent}
.trash{font:inherit;border:2px solid var(--line);background:transparent;color:var(--bad);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.trash:active{background:var(--bad-bg)}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools input{flex:2;min-width:160px}
.tools select{flex:1;min-width:140px}
.seg{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;font:inherit;font-weight:900;font-size:.84rem;border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:10px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:16px 2px 0;color:var(--muted);font-size:.82rem;flex-wrap:wrap}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-weight:700;font-family:'Nunito',sans-serif}
.chart .bv{fill:var(--ink);font-size:11px;font-weight:900;font-family:'Nunito',sans-serif}
.chart .bar-m{fill:var(--green);pointer-events:none}
.chart text{pointer-events:none}
.chart .bar-m.dim{fill:color-mix(in srgb,var(--green) 55%,var(--surface))}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.bar-m,.chart .bar-m.hl{fill:var(--green-d)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;font-weight:800;padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,0);z-index:3;box-shadow:0 4px 12px rgb(0 0 0/.2)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:8px;font-size:.88rem}
.hb .tr{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:99px;background:var(--green)}
.hb.low .tr i{background:var(--amber)}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.hb small{grid-column:2/4;color:var(--faint);font-size:.74rem;margin-top:-6px}
/* battles */
.bt{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.bt .p{display:flex;flex-direction:column;min-width:0}
.bt .p.b{text-align:right;align-items:flex-end}
.bt .p b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bt .p small{color:var(--muted);font-weight:700;font-size:.78rem}
.bt .p.win b{color:var(--green)}
.bt .p.win b::after{content:" \1F3C6"}
.bt .p.b.win b::after{content:""}
.bt .p.b.win b::before{content:"\1F3C6  "}
.bt .mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px}
.bt .sc{font-family:'Baloo 2',sans-serif;font-size:1.3rem;line-height:1}
.bt .st{font-size:.72rem;font-weight:900;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st.wait{background:#FEF3C7;color:#92400E}.st.done{background:var(--green-l);color:var(--green)}.st.gone{background:var(--surface-2);color:var(--muted)}
@media(prefers-color-scheme:dark){.st.wait{background:#3A2E12;color:#F4C35C}}
.bt .when{grid-column:1/4;color:var(--faint);font-size:.74rem;text-align:center;margin-top:-2px}
/* classes */
.ctab{width:100%;border-collapse:collapse;font-size:.88rem}
.ctab th,.ctab td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctab th:first-child,.ctab td:first-child{text-align:left}
.ctab th{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.ctab tr.best td:first-child::after{content:" \2B50"}
.scroll-x{overflow-x:auto;margin:0 -16px;padding:0 16px}
.pbar{display:inline-block;width:44px;height:8px;border-radius:99px;background:var(--surface-2);vertical-align:middle;margin-left:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px}
/* feed */
.day-h{font-family:'Baloo 2',sans-serif;font-size:1.05rem;margin:14px 2px 6px;color:var(--muted)}
.ev{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.ev .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:var(--green-l);font-size:1rem}
.ev .ic.duel{background:#FDE2E4}.ev .ic.new{background:#E0E7FF}.ev .ic.reset{background:var(--surface-2)}
@media(prefers-color-scheme:dark){.ev .ic.duel{background:#3A1F24}.ev .ic.new{background:#1E2648}}
.ev .tx{flex:1;min-width:0;font-size:.9rem}
.ev.who b{display:inline;font-size:inherit;white-space:normal}
.ev .tx small{display:block;color:var(--faint);font-size:.76rem;font-weight:700}
.ev .t{color:var(--faint);font-size:.78rem;white-space:nowrap}
/* sheets */
.modal-bg{position:fixed;inset:0;background:rgb(10 20 20/.55);display:grid;place-items:center;padding:14px;z-index:10}
.modal{background:var(--surface);border-radius:22px;padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgb(0 0 0/.35);max-height:92vh;overflow-y:auto}
.modal.wide{max-width:640px}
.modal h2{font-size:1.4rem}
.modal p{margin:0;color:var(--muted)}
.modal .acts{display:flex;gap:10px}
.modal .acts>*{flex:1}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-head .nm{flex:1;min-width:0}
.sh-head small{color:var(--muted);font-weight:700}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:420px){.sgrid{grid-template-columns:repeat(2,1fr)}}
.sgrid div{background:var(--surface-2);border-radius:12px;padding:9px 10px}
.sgrid b{display:block;font-family:'Baloo 2',sans-serif;font-size:1.3rem;line-height:1.05}
.sgrid span{font-size:.74rem;color:var(--muted);font-weight:800}
.sk-t{width:100%;border-collapse:collapse;font-size:.9rem}
.sk-t th,.sk-t td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sk-t th:first-child,.sk-t td:first-child{text-align:left}
.sk-t th{color:var(--muted);font-size:.76rem}
.sk-t tr.tot td{border-bottom:0;font-weight:900}
.sk-t .ok{color:var(--green)}.sk-t .no{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:800;z-index:20;max-width:90vw}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<script>
(function () {

  var data = null, act = null, duels = null, timer = null, lastOk = null, busy = false;
  var view = 'today', sfilter = 'today', sort = 'pts', query = '', bfilter = 'all', csort = 'active';
  var NCLS = { '9': 5, '10': 5, '11': 8, '12': 9 }, gsel = 'all', csel = 'all';
  try { var fs = JSON.parse(localStorage.getItem('epz-teacher-filter') || '{}'); gsel = fs.g || 'all'; csel = fs.c || 'all'; view = fs.v || 'today'; } catch (e) { /* ignore */ }
  var SKN = [['grammar', 'Grammar'], ['vocabulary', 'Vocabulary'], ['reading', 'Reading'], ['listening', 'Listening'], ['building', 'Build Sentences'], ['scramble', 'Story Order'], ['correction', 'Fix the Mistake']];

  // ---------------------------------------------------------------- helpers
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var num = function (n) { return Number(n || 0).toLocaleString('en-US'); };
  var dayOf = function (d) { return new Date(d).toLocaleDateString('en-CA', { timeZone: TZ }); };
  var nowMs = function () { return data && data.now ? Date.parse(data.now) + (Date.now() - lastOk) : Date.now(); };
  var todayKey = function () { return dayOf(nowMs()); };
  var shiftDay = function (key, n) { var d = new Date(key + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  var dayLabel = function (key) {
    var t = todayKey();

    return new Date(key + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });

  var ago = function (d) {
    if (!d) return 'never';
    var s = Math.max(0, (nowMs() - new Date(d).getTime()) / 1000);
    if (s < 90) return 'just now';

  var initials = function (n) { var w = String(n || '?').trim().split(/\s+/); return ((w[0] || '?')[0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase(); };

    }).then(function (r) {
      clearTimeout(t);
      if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }

    }, function (e) { clearTimeout(t); throw e; });
  }
  // optional parts: a 404 means the SQL step for that part was not run yet
  function optional(name, body) {
    return rpc(name, body).then(function (r) { return r && r.ok ? r : { ok: false, error: r && r.error }; }, function (e) { return { ok: false, missing: e && e.status === 404, offline: !(e && e.status) }; });
  }

    var el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 2600);
  }
  function keep() { try { localStorage.setItem('epz-teacher-filter', JSON.stringify({ g: gsel, c: csel, v: view })); } catch (e) { /* ignore */ } }

  // ---------------------------------------------------------------- login and loading
  function loginView(error) {
    app.innerHTML =
      '<div class="login card"><div class="brand"><span class="logo">E</span><div><h1>Teacher panel</h1><small style="color:var(--muted);font-weight:800">English Practice Zone</small></div></div>' +
      '<form id="f" style="display:flex;flex-direction:column;gap:12px"><label for="c">Your code</label>' +

  // ---------------------------------------------------------------- Students

      var map = {}; (r.days || []).forEach(function (d) { map[d.day] = d; });
      var pts = [];
      for (var i = 29; i >= 0; i--) { var k = shiftDay(t, -i), d = map[k] || { p: 0, r: 0 }; pts.push({ label: new Date(k + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', timeZone: 'UTC' }), value: d.p || 0, tip: dayLabel(k) + ': ' + num(d.p || 0) + ' pts · ' + (d.r || 0) + ' rounds' }); }
      var any = pts.some(function (p) { return p.value; });
      box.innerHTML = any ? barChart('ch-student', pts, { aria: 'Points per day for ' + s.name, h: 170 }) : '<p class="empty">No points in the last 30 days' + (r.since ? ' (saved since ' + esc(dayLabel(dayOf(r.since))) + ')' : '') + '.</p>';
      if (any) wireChart('ch-student', pts);
    });
  }

  function confirmDelete(id, name) {
    var bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h2>Remove ' + esc(name) + '?</h2>' +
      '<p>This name and its points disappear from the ranking. If the student opens the site again, they start fresh and type a new name.</p>' +
      '<div class="acts"><button class="btn btn-ghost" id="no" type="button">Cancel</button><button class="btn btn-bad" id="yes" type="button">Remove</button></div></div>';
    document.body.appendChild(bg);
    var close = function () { bg.remove(); };
    bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    bg.querySelector('#no').onclick = close;
    var yes = bg.querySelector('#yes');
    yes.onclick = function () {
      yes.disabled = true; yes.textContent = 'Removing…';
      rpc('teacher_delete', { p_code: code, p_id: id }).then(function (res) {
        close();
        if (res && res.ok) { toast(name + ' removed'); busy = false; load(false); }
        else toast('Could not remove. ' + (res && res.error === 'locked' ? 'Too many wrong tries.' : 'Try again.'));
      }, function () { close(); toast('No connection. Nothing was removed.'); });
    };
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden && code && data && Date.now() - lastOk > 20000) load(false); });
  if (code) { app.innerHTML = '<div class="empty">Loading…</div>'; load(false); } else loginView('');
})();
</script>
</body>
</html>
