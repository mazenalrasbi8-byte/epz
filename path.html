<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A63">
<title>English Practice Zone - Lesson Path</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%230B7A63'/><path d='M20 40 L32 18 L44 40 Z' fill='%23F4A51C'/></svg>">
<style>
:root{
  --bg:#EDF3F0; --surface:#fff; --ink:#13232F; --muted:#566672; --line:#D6E0DC;
  --brand:#0B7A63; --brand-deep:#06604D; --sun:#F4A51C; --sun-deep:#C98207;
  --good:#168A3F; --good-bg:#DCF5E3; --good-ink:#0E5528;
  --bad:#D13A3A; --bad-bg:#FCE3E1; --bad-ink:#7A1C1C;
  --heart:#E5484D; --locked:#C9D3CF; --locked-deep:#AEBAB5;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Baloo 2','Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
.ic{display:inline-block;vertical-align:middle;flex:none}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:2px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:8px;height:60px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--brand-deep);font-weight:800;text-decoration:none;font-size:15px;padding:8px 6px;border-radius:10px;white-space:nowrap}
.back:hover{background:var(--bg)}
.stats{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:16px;padding:6px 10px;border-radius:999px;background:var(--bg)}
.chip.streak{color:#C2410C}.chip.streak.off{color:var(--muted)}
.chip.xp{color:var(--sun-deep)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--bg)}

/* ---------- hero ---------- */
.hero{padding:18px 0 6px}
.hero h1{font-size:26px;color:var(--brand-deep)}
.hero .sub{color:var(--muted);font-weight:700;font-size:15px;margin-top:4px}
.hero .teacher{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-weight:800;font-size:15px}
.hero .teacher .av{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}
.daycard{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.daycard .big{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#FFEDE3;color:#C2410C;flex:none}
.daycard.safe .big{background:var(--good-bg);color:var(--good)}
.daycard b{display:block;font-size:16px}
.daycard span{color:var(--muted);font-size:14px;font-weight:600}

/* ---------- path ---------- */
.unit{margin:26px 0 10px}
.unit-head{border-radius:20px;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.unit-head .lbl{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.unit-head h2{font-size:24px;margin-top:2px}
.unit-head .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:10px;overflow:hidden}
.unit-head .bar i{display:block;height:100%;background:#fff;border-radius:99px}
.unit-head .cnt{font-size:13px;font-weight:800;margin-top:5px;opacity:.95}
.unit-head .badge{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.unit-head .grow{flex:1;min-width:0}
.unit.locked .unit-head{filter:saturate(.35);opacity:.85}

.nodes{display:flex;flex-direction:column;align-items:center;gap:22px;padding:34px 0 8px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node-wrap.cur{margin-top:30px}
.node{--c:var(--brand);--cd:var(--brand-deep);width:76px;height:72px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 7px 0 var(--cd);position:relative;transition:transform .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node.locked{--c:var(--locked);--cd:var(--locked-deep);color:#fff}
.node.done{--c:var(--sun);--cd:var(--sun-deep)}
.node.test{width:88px;height:84px;border-radius:26px}
.node.current::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--c);opacity:.35;animation:pulse 1.6s ease-out infinite}
.node.test.current::after{border-radius:32px}
@keyframes pulse{0%{transform:scale(.92);opacity:.55}100%{transform:scale(1.12);opacity:0}}
.node .tick{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--good);border:3px solid var(--bg);display:grid;place-items:center}
.node-name{margin-top:12px;font-weight:800;font-size:14px;color:var(--ink);text-align:center;max-width:150px;line-height:1.2}
.node-name small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.node-wrap.locked .node-name{color:var(--muted)}
.start-tip{position:absolute;top:-40px;background:var(--surface);color:var(--c,var(--brand));border:2px solid var(--line);border-radius:12px;padding:3px 12px;font-weight:900;font-size:14px;letter-spacing:.05em;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;z-index:2}
.start-tip::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line);border-bottom:0}
@keyframes bob{50%{transform:translateY(-4px)}}
.finish{margin:30px 0 10px;text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:20px}
.finish h2{color:var(--brand-deep);font-size:22px;margin-top:6px}
.footer{text-align:center;color:var(--muted);font-size:14px;padding:30px 0 50px}
.footer button{color:var(--muted);text-decoration:underline;font-size:14px;margin-top:8px;padding:8px}

/* ---------- sheet / modal ---------- */
.shade{position:fixed;inset:0;background:rgba(10,25,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.shade.center{align-items:center;padding:20px}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.shade.center .sheet{border-radius:24px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .kind{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:#fff}
.sheet h3{font-size:24px;margin:10px 0 4px}
.sheet p{margin:0 0 16px;color:var(--muted);font-weight:600}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:16px;font-weight:900;font-size:18px;letter-spacing:.03em;background:var(--brand);color:#fff;box-shadow:0 5px 0 var(--brand-deep);text-transform:uppercase;transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-deep)}
.btn[disabled]{background:var(--locked);box-shadow:0 5px 0 var(--locked-deep);color:#fff;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--brand-deep);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.red{background:var(--bad);box-shadow:0 5px 0 #9E2323}
.btn.green{background:var(--good);box-shadow:0 5px 0 #0E5E2B}
.btn+.btn{margin-top:14px}

/* ---------- lesson ---------- */
.lesson{position:fixed;inset:0;z-index:30;background:var(--surface);display:flex;flex-direction:column;height:100vh;height:100dvh}
.l-top{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:620px;width:100%;margin:0 auto}
.prog{flex:1;height:16px;background:#E5ECE9;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--good);border-radius:99px;transition:width .35s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.hearts{display:inline-flex;align-items:center;gap:4px;font-weight:900;color:var(--heart);font-size:18px}
.hearts.hit{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.l-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.l-body .inner{max-width:620px;margin:0 auto;padding:8px 18px 28px}
.q-kind{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 6px}
.q-prompt{font-family:var(--display);font-size:23px;line-height:1.25;margin:0 0 18px;font-weight:700}
.q-prompt.small{font-size:20px}
.blank{display:inline-block;min-width:60px;border-bottom:3px solid var(--ink);margin:0 4px;transform:translateY(-4px)}
.hint{color:var(--muted);font-weight:700;font-size:15px;margin:-8px 0 16px}
.passage{border:2px solid var(--line);border-radius:16px;background:#F7FAF9;margin:0 0 18px}
.passage summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:900;color:#1D5FD6;display:flex;align-items:center;gap:8px}
.passage summary::-webkit-details-marker{display:none}
.passage summary .tg{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap;padding-left:6px}
.passage:not([open]) summary .tg::before{content:"Show"}
.passage[open] summary .tg::before{content:"Hide"}
.passage .txt{padding:0 14px 14px;max-height:38vh;overflow-y:auto;white-space:pre-line;font-size:16px}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:58px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 14px;text-align:left;font-weight:800;font-size:18px;background:var(--surface);display:flex;align-items:center;gap:10px}
.opt .k{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted);flex:none}
.opt.sel{border-color:#5AA7E8;background:#E8F3FD;color:#0E4C86}
.opt.sel .k{border-color:#5AA7E8;color:#0E4C86}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good-ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink)}
.opts.lock .opt{cursor:default}
.tf .opt{justify-content:center;font-size:20px}
.answer-in{width:100%;min-height:58px;border:2px solid var(--line);border-radius:16px;padding:14px;font:inherit;font-size:19px;font-weight:700;background:#F7FAF9;color:var(--ink);resize:none}
.answer-in:focus{border-color:#5AA7E8;background:#fff;outline:none}
textarea.answer-in{min-height:110px;line-height:1.4}
.answer-in.right{border-color:var(--good);background:var(--good-bg)}
.answer-in.wrong{border-color:var(--bad);background:var(--bad-bg)}
.lbl-s{font-weight:800;color:var(--muted);font-size:14px;margin:0 0 8px}
.wrongline{background:var(--bad-bg);color:var(--bad-ink);border-radius:12px;padding:10px 12px;font-weight:800;margin:0 0 14px;font-size:18px}
.tiles-target{min-height:66px;border-bottom:2px solid var(--line);padding:8px 0 12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:18px}
.tiles-target.v,.tiles-pool.v{flex-direction:column;flex-wrap:nowrap}
.tiles-target .ph{color:var(--muted);font-weight:700;align-self:center;font-size:15px}
.tiles-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:9px 13px;font-weight:800;font-size:18px;background:var(--surface);min-height:48px;text-align:left}
.tiles-pool.v .tile,.tiles-target.v .tile{width:100%;font-size:16px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.tile .n{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900;flex:none;margin-top:1px}
.tiles-target.right .tile{border-color:var(--good);background:var(--good-bg)}
.tiles-target.wrong .tile{border-color:var(--bad);background:var(--bad-bg)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.mt{min-height:56px;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:8px 10px;font-weight:800;font-size:16px;background:var(--surface);text-align:center}
.mt.sel{border-color:#5AA7E8;background:#E8F3FD}
.mt[data-p]{color:#fff;border-color:rgba(0,0,0,.15)}
.mt.bad{background:var(--bad-bg)!important;color:var(--bad-ink)!important;border-color:var(--bad)!important}
.mt.ok{background:var(--good-bg)!important;color:var(--good-ink)!important;border-color:var(--good)!important}
.l-foot{flex:none;border-top:2px solid var(--line);background:var(--surface);padding:14px 18px calc(16px + env(safe-area-inset-bottom))}
.l-foot .inner{max-width:620px;margin:0 auto}
.l-foot.ok{background:var(--good-bg);border-top-color:transparent}
.l-foot.no{background:var(--bad-bg);border-top-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;max-height:34vh;overflow-y:auto}
.fb .bi{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.fb h3{font-size:22px}
.l-foot.ok .fb{color:var(--good-ink)}
.l-foot.no .fb{color:var(--bad-ink)}
.fb .ans{font-weight:800;margin-top:2px;font-size:16px;white-space:pre-line}
.fb .ex{font-weight:600;font-size:15px;margin-top:4px;opacity:.9}
.fb-anim{animation:up .2s ease-out}

/* ---------- result ---------- */
.result{position:fixed;inset:0;z-index:40;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px calc(24px + env(safe-area-inset-bottom));overflow:hidden}
.result .medal{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE08A,var(--sun) 60%,var(--sun-deep));display:grid;place-items:center;box-shadow:0 8px 0 #B5760A;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.result.sad .medal{background:radial-gradient(circle at 35% 30%,#FFB3B5,var(--heart) 65%,#A8282C);box-shadow:0 8px 0 #7E1D20}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.result h2{font-size:30px;color:var(--brand-deep);margin-top:22px}
.result.sad h2{color:var(--bad)}
.result p.msg{color:var(--muted);font-weight:700;margin:6px 0 18px;max-width:360px}
.boxes{display:flex;gap:10px;width:100%;max-width:400px;margin-bottom:26px}
.box{flex:1;border:2px solid var(--c);border-radius:16px;overflow:hidden;animation:pop .5s .15s both}
.box .t{background:var(--c);color:#fff;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px}
.box .v{font-weight:900;font-size:22px;padding:10px 4px;color:var(--c);display:flex;align-items:center;justify-content:center;gap:4px}
.result .acts{width:100%;max-width:400px;position:relative;z-index:1}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){.hero h1{font-size:30px}}
</style>
</head>
<body>
<header class="topbar">

    <div class="stats">
      <span class="chip streak" id="st-streak" title="Daily streak"></span>

<main class="wrap" id="pathview">

<div id="layer"></div>

<script>
"use strict";
/* Questions copied from the Grade 9 "Book 9A" activities of the main page (index.html). */

rompt":"My dad asked me to help him ___ up his new smart watch.","options":["set","turn","go","plug"],"answer":"set"},{"type":"mcq","prompt":"I ___ my phone in when my battery's low.","options":["plug","set","turn","come"],"answer":"plug"},{"type":"mcq","prompt":"A warning light ___ on. (starts working)","options":["comes","plugs","sets","goes up"],"answer":"comes"},{"type":"mcq","prompt":"Which sentence is correct?","options":["Turn it up now.","Turn up it now.","Turn now up it.","It turn up now."],"answer":"Turn it up now.","explanation":"With a pronoun, it goes between the verb and the particle."},{"type":"mcq","prompt":"\"Turn the volume up\" means\u2026","options":["make the sound louder","make the sound quieter","stop the machine","connect it to electricity"],"answer":"make the sound louder"}]},{"id":"u3-v3","kind":"vocab","title":"Smart homes","qs":[{"type":"mcq","prompt":"I asked the ___ on my phone about the weather.","options":["AI assistant","battery","smart speaker","air conditioning"],"answer":"AI assistant"},{"type":"mcq","prompt":"Download the ___ to control the lights from your phone.","options":["app","battery","central heating","TV"],"answer":"app"},{"type":"mcq","prompt":"My phone's ___ is low. I need to charge it.","options":["battery","central heating","device","hologram"],"answer":"battery"},{"type":"mcq","prompt":"It's freezing! Turn on the ___.","options":["central heating","device","coast","version"],"answer":"central heating"},{"type":"mcq","prompt":"___ on the icon to open the app.","options":["click","download","speak","survive"],"answer":"click"},{"type":"mcq","prompt":"Please switch off every electronic ___ before the exam.","options":["device","central heating","icon","challenge"],"answer":"device"},{"type":"mcq","prompt":"I ask the ___ to play my favourite nasheed.","options":["smart speaker","app","conversation","microwave"],"answer":"smart speaker"},{"type":"mcq","prompt":"The school has a new computer ___.","options":["system","central heating","smart speaker","fridge-freezer"],"answer":"system"}]},{"id":"u3-g1","kind":"grammar","title":"Talking about the future","qs":[{"type":"mcq","prompt":"I feel tired. I think I ___ go home now.","options":["'ll","'m","'m going","going"],"answer":"'ll","explanation":"Unplanned decision now \u2192 will."},{"type":"mcq","prompt":"Look at the big grey clouds! It ___ rain soon.","options":["'s going to","'ll","rains","'s raining to"],"answer":"'s going to","explanation":"Evidence now \u2192 going to."},{"type":"mcq","prompt":"I ___ in a football match on Saturday. Everything is arranged.","options":["'m playing","'ll play","play","played"],"answer":"'m playing","explanation":"Arrangement \u2192 present continuous."},{"type":"mcq","prompt":"The film ___ at 9.30 p.m.","options":["finishes","'s finishing to","'ll finishing","finish"],"answer":"finishes","explanation":"Timetable \u2192 present simple."},{"type":"mcq","prompt":"\"This bag is heavy.\" \u2014 \"I ___ help you with it.\"","options":["'ll","'m","am helping","helping"],"answer":"'ll","explanation":"An offer \u2192 will."},{"type":"mcq","prompt":"Perhaps we ___ use e-books for all our studies in the future.","options":["will","are going","are","do"],"answer":"will","explanation":"Personal opinion about the future \u2192 will."},{"type":"mcq","prompt":"I ___ visit my friend in T\u00fcrkiye sometime next year. I haven't booked anything yet.","options":["'m going to","'m visiting","visit","'ll visiting"],"answer":"'m going to","explanation":"Intention, not arranged \u2192 going to."},{"type":"mcq","prompt":"Our flight ___ at 10.40 tonight, so we need to leave home at 7.","options":["leaves","is leave","will leaving","leaving"],"answer":"leaves","explanation":"Timetable \u2192 present simple."}]},{"id":"u3-g2","kind":"grammar","title":"-ing form, advice and suggestions","qs":[{"type":"mcq","prompt":"___ vegetables is good for you.","options":["Eating","Eat","To eating","Eaten"],"answer":"Eating","explanation":"-ing form as the subject."},{"type":"mcq","prompt":"I went home after ___ my game.","options":["finishing","finish","to finish","finished"],"answer":"finishing","explanation":"After a preposition \u2192 -ing."},{"type":"mcq","prompt":"You ___ have a nap. You look tired.","options":["should","ought","how about","why don't"],"answer":"should","explanation":"Advice \u2192 should + verb."},{"type":"mcq","prompt":"You ought ___ look for it properly.","options":["to","\u2013","for","at"],"answer":"to"},{"type":"mcq","prompt":"How about ___ a toasted sandwich?","options":["making","make","to make","made"],"answer":"making","explanation":"How about + -ing."},{"type":"mcq","prompt":"Why don't you ___ a tablet?","options":["get","getting","to get","got"],"answer":"get","explanation":"Why don't you + base verb."},{"type":"fill","prompt":"You shouldn't leave without ___ (say) goodbye.","answer":"saying"},{"type":"fill","prompt":"My dad finished ___ (paint) my room yesterday.","answer":"painting"}]},{"id":"u3-r1","kind":"reading","title":"Machines at home","qs":[{"type":"mcq","prompt":"Who bought the smart speaker?","options":["Dad","Mum","Grandfather","The writer"],"answer":"Dad","passage":"reading-easy-132"},{"type":"mcq","prompt":"What colour is the light on the speaker?","options":["Blue","Black","Red","White"],"answer":"Blue","passage":"reading-easy-132"},{"type":"mcq","prompt":"What does the writer use the speaker for?","options":["To set an alarm","To check the weather","To play stories","To call friends"],"answer":"To set an alarm","passage":"reading-easy-132"},{"type":"truefalse","prompt":"The speaker always understands the grandfather.","answer":"False","explanation":"Sometimes it doesn't understand him.","passage":"reading-easy-132"},{"type":"mcq","prompt":"Which is the busiest room in the house?","options":["The kitchen","The living room","The bedroom","The garden"],"answer":"The kitchen","passage":"reading-easy-134"},{"type":"mcq","prompt":"What does Dad use the microwave for?","options":["To heat his breakfast","To make tea","To wash plates","To keep juice cold"],"answer":"To heat his breakfast","passage":"reading-easy-134"},{"type":"mcq","prompt":"Where do they put the plates after lunch?","options":["In the dishwasher","In the fridge-freezer","In the microwave","In the washing machine"],"answer":"In the dishwasher","passage":"reading-easy-134"},{"type":"truefalse","prompt":"The writer often uses the coffee maker.","answer":"False","explanation":"The writer is not allowed to use it yet.","passage":"reading-easy-134"}]},{"id":"u3-r2","kind":"reading","title":"Robots and smart homes","qs":[{"type":"mcq","prompt":"What can some robots already do?","options":["Clean floors and cut the grass","Cook big dinners","Drive children to school","Teach English"],"answer":"Clean floors and cut the grass","passage":"reading-medium-134"},{"type":"mcq","prompt":"What is the robot in Japan for?","options":["Helping older people stand up and walk","Washing cars","Playing football","Cleaning windows"],"answer":"Helping older people stand up and walk","passage":"reading-medium-134"},{"type":"truefalse","prompt":"Home robots are cheap today.","answer":"False","explanation":"They are still very expensive.","passage":"reading-medium-134"},{"type":"mcq","prompt":"Why don't some people want a robot at home?","options":["They don't feel comfortable with it.","Robots are too small.","Robots are too noisy.","Robots can't move."],"answer":"They don't feel comfortable with it.","passage":"reading-medium-134"},{"type":"mcq","prompt":"What can you do from your phone in a smart home?","options":["Switch off the lights","Cook dinner","Clean the floor","Wash clothes by hand"],"answer":"Switch off the lights","passage":"reading-challenge-134"},{"type":"mcq","prompt":"How can smart devices save energy?","options":["They switch things off when nobody is in the room.","They use solar panels.","They work only at night.","They are very small."],"answer":"They switch things off when nobody is in the room.","passage":"reading-challenge-134"},{"type":"mcq","prompt":"Why are some people worried about smart speakers?","options":["They are always listening.","They are too loud.","They are ugly.","They are too cheap."],"answer":"They are always listening.","passage":"reading-challenge-134"},{"type":"truefalse","prompt":"Smart homes always work well without the internet.","answer":"False","explanation":"Some become useless without the internet.","passage":"reading-challenge-134"}]},{"id":"u3-w1","kind":"writing","title":"Plans and advice","qs":[{"type":"build","prompt":"will (prediction)","answer":"I think robots will help us at home."},{"type":"build","prompt":"going to (plan)","answer":"I am going to learn French next year."},{"type":"build","prompt":"Advice","answer":"You should switch off the lights to save energy."},{"type":"build","prompt":"Suggestion","answer":"Why don't we make an omelette for lunch?"},{"type":"correct","prompt":"Look at the clouds! It will rain.","answer":"Look at the clouds! It is going to rain.|Look at the clouds! It's going to rain.","explanation":"Evidence now \u2192 going to."},{"type":"correct","prompt":"I play in a football match on Saturday.","answer":"I am playing in a football match on Saturday.|I'm playing in a football match on Saturday.","explanation":"Arrangement \u2192 present continuous."},{"type":"order","prompt":"Smart homes","items":["Smart homes are becoming more popular every year.","On the one hand, they save time and energy.","On the other hand, they can be expensive and need the internet.","In conclusion, I think they are useful, but not for everyone."]},{"type":"order","prompt":"An email with plans","items":["Hi Laila,","Are you free next Thursday?","We're going to visit the new science museum.","Let me know if you can come! Mariam"]}]},{"id":"u3-t","kind":"test","title":"Unit 3 Test","qs":[{"type":"mcq","prompt":"Learning a new language is a big ___.","options":["challenge","earphones","screen","air conditioning"],"answer":"challenge"},{"type":"mcq","prompt":"Big cars ___ a lot of fuel.","options":["consume","predict","tell","stay"],"answer":"consume"},{"type":"mcq","prompt":"Artists ___ beautiful things.","options":["create","predict","translate","realise"],"answer":"create"},{"type":"mcq","prompt":"YouTube is a popular video ___.","options":["platform","hologram","games controller","microwave"],"answer":"platform"},{"type":"mcq","prompt":"Can you ___ who will win the match?","options":["predict","create","stay","achieve"],"answer":"predict"},{"type":"mcq","prompt":"We can have pizza or a burger \u2013 what's your ___?","options":["preference","screen","smart watch","dishwasher"],"answer":"preference"},{"type":"correct","prompt":"I think robots will cleaning our homes.","answer":"I think robots will clean our homes.","explanation":"will + base verb"},{"type":"correct","prompt":"Look at those clouds! It will rain.","answer":"Look at those clouds! It's going to rain.","explanation":"Evidence now \u2192 going to"},{"type":"correct","prompt":"We going to visit Sur next week.","answer":"We are going to visit Sur next week.","explanation":"are going to"},{"type":"correct","prompt":"I enjoy to watch talent shows.","answer":"I enjoy watching talent shows.","explanation":"enjoy + -ing"},{"type":"correct","prompt":"You should to practise every day.","answer":"You should practise every day.","explanation":"should + base verb"},{"type":"correct","prompt":"Learn a language is fun.","answer":"Learning a language is fun.","explanation":"-ing as subject"},{"type":"build","prompt":"Will (prediction)","answer":"Robots will do most of the housework."},{"type":"build","prompt":"Will (prediction)","answer":"I think people will live on the moon."}]}]}],"passages":{"reading-easy-135":{"title":"The School Talent Show","text":"Last Thursday, our school had a talent show in the big hall. Twelve students took part. Majid told funny stories and everyone laughed. Two brothers did a science performance with water and colours. Yousef was very nervous before he went on stage, but he read his poem beautifully. At the end, the head teacher gave Yousef first prize. He was really pleased!"},"reading-easy-136":{"title":"A Day in Wadi Shab","text":"On Saturday, my family went to Wadi Shab. It is a beautiful valley near the coast, between Muscat and Sur. We walked for about an hour between the mountains. Then we swam in the green pools. The water was cool and clear. My little sister was scared at first, but then she loved it. We ate sandwiches under a tree and drove home in the evening."},"reading-easy-131":{"title":"My Cousin Hamed","text":"My cousin Hamed is fifteen and he lives in Nizwa. He is very sociable and he has got lots of friends. He is also funny, and he always makes everyone laugh at family dinners. Hamed is sporty too. He plays football three times a week and he swims on Fridays. His sister Aisha is different. She is quite shy, but she is very clever and she reads a book every week."},"reading-medium-135":{"title":"An Email from Muscat","text":"Hi Tom,\nThanks for your email! I'm writing to you from my grandparents' house in Muscat. We're staying here for the holidays. Right now, my grandmother is making halwa in the kitchen and the whole house smells delicious! Every morning, I go for a walk on the beach with my grandfather. He's teaching me the names of the fish that the fishermen catch. Tomorrow we're going to visit the old fort in Muttrah. What are you doing these days? Write back soon,\nSaif"},"reading-medium-131":{"title":"Why Are Some People Shy?","text":"Many teenagers feel shy, especially when they meet new people. A shy person often feels nervous about speaking in front of others and worries about what people think. Experts say that shyness is normal and that it is not the same as being unfriendly. In fact, many shy people are kind, good listeners and loyal friends. If you are shy, start with small steps. Say hello to one new person each day, or ask a classmate a simple question. Little by little, you will become more confident."},"reading-challenge-133":{"title":"Introverts and Extroverts","text":"Psychologists often describe people as introverts or extroverts. Extroverts usually feel energetic when they are with other people. They enjoy parties, team sports and talking to strangers. Introverts, on the other hand, need quiet time alone to recharge after being with groups. This doesn't mean introverts are rude or unfriendly; they simply prefer deep conversations with a few close friends. Most people are actually somewhere in the middle. Understanding your personality can help you choose activities, study methods and even jobs that suit you."},"reading-easy-133":{"title":"Learning a New Language","text":"Salma is learning Spanish. She started six months ago because her family is going to visit Spain next summer. She has a lesson online every Tuesday, and she practises with an app for ten minutes every day. The hardest part for her is pronunciation, because some sounds are very different from Arabic. Her teacher is very patient and she always explains things clearly."},"reading-medium-132":{"title":"One Country, Many Languages","text":"Arabic is the official language of Oman, but people speak several other languages there too. In the south, some families speak Jibbali or Mehri at home. These are very old languages, and they have no written form that most people use. On the coast, you can also hear Swahili and Balochi, because of Oman's long history of trade. For many Omanis, speaking two languages is part of their identity and culture. Today, most students also learn English at school."},"reading-medium-133":{"title":"The Night the Power Went Off","text":"Last winter, there was a big storm in our town. I was doing my homework on my tablet, my brother was watching a football match on TV, and my mum was cooking dinner. Suddenly, all the lights went off. The TV, the fridge and the air conditioning stopped. My brother was annoyed because the match was exciting. We found some candles and sat together in the living room. My dad told us stories about his childhood, when his village didn't have electricity. In the end, it was a really lovely evening."},"reading-challenge-132":{"title":"Languages at Risk","text":"There are about seven thousand languages in the world today, but experts believe that almost half of them are at risk. When the last speakers of a language die, the language disappears, and so does a lot of knowledge about plants, animals, history and culture. Young people often prefer the language they hear at school, on TV and on social media, so they stop using the language of their grandparents. Fortunately, communities are fighting back. They are recording older speakers, creating dictionaries and even developing apps so that children can learn their local language on a phone."},"reading-easy-132":{"title":"Our New Smart Speaker","text":"Last month my dad bought a smart speaker for our living room. It is small and black, and it has got a blue light on the top. We talk to it every day. In the morning, my mum asks it about the weather. My little brother asks it to play funny stories. I use it to set an alarm for school. Sometimes it doesn't understand my grandfather, so he says the question again, slowly and loudly!"},"reading-easy-134":{"title":"A Busy Kitchen","text":"Our kitchen is the busiest room in the house. In the morning, my mum switches on the kettle and makes tea. My dad heats his breakfast in the microwave because he is always in a hurry. After lunch, we put the plates in the dishwasher. We keep fruit, milk and juice in the big fridge-freezer. My favourite machine is the coffee maker, but I'm not allowed to use it yet!"},"reading-medium-134":{"title":"Robot Helpers at Home","text":"Engineers are building robots that will help people at home. Some robots can already clean floors and cut the grass. Soon, robots will probably fold clothes, wash dishes and even cook simple meals. A company in Japan is testing a robot that can help older people stand up and walk. However, home robots are still very expensive, and many people don't feel comfortable with a machine in their house. Experts think that in about twenty years, robots will be as common as washing machines."},"reading-challenge-134":{"title":"Smart Homes: Helpful or Harmful?","text":"In a smart home, you can switch off the lights, turn up the air conditioning or check who is at the door, all from your phone. Many families love the convenience. Smart devices can also save energy, because they switch things off when nobody is in the room. However, some people are worried. Smart speakers are always listening for commands, so what happens to all that information? And if the internet stops working, some 'smart' homes become surprisingly useless. Before buying a smart device, it is a good idea to read about how the company protects your data."}}};

function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function normalize(s) { return String(s == null ? "" : s).replace(/[’‘]/g, "'").replace(/[“”]/g, '"').toLowerCase().replace(/[.,!?;:"]/g, "").replace(/\s+/g, " ").trim(); }
function answerMatches(given, key) { var g = normalize(given); return String(key == null ? "" : key).split("|").some(function (k) { return normalize(k) !== "" && normalize(k) === g; }); }
function firstAnswer(key) { return String(key == null ? "" : key).split("|")[0]; }
function expandShort(s) {
  return String(s == null ? "" : s).replace(/[’‘]/g, "'").toLowerCase()
    .replace(/\bcan't\b/g, "cannot").replace(/\bcan not\b/g, "cannot").replace(/\bwon't\b/g, "will not").replace(/\bshan't\b/g, "shall not")
    .replace(/\b([a-z]+)n't\b/g, "$1 not").replace(/\bi'm\b/g, "i am").replace(/\b([a-z]+)'re\b/g, "$1 are").replace(/\b([a-z]+)'ll\b/g, "$1 will").replace(/\b([a-z]+)'ve\b/g, "$1 have");
}
function answerForms(s) {
  var forms = [expandShort(s)];
  var RULES = [[/\b([a-z]+)'s\b/, ["is", "has"], "s"], [/\b([a-z]+)'d\b/, ["would", "had"], "d"]];
  RULES.forEach(function (r) {
    for (var round = 0; round < 4 && forms.some(function (v) { return r[0].test(v); }); round++) {
      forms = [].concat.apply([], forms.map(function (v) {
        return r[0].test(v) ? [v.replace(r[0], "$1" + r[2])].concat(r[1].map(function (w) { return v.replace(r[0], "$1 " + w); })) : [v];
      }));
    }
  });
  return forms.map(function (v) { return v.replace(//g, "'"); });
}
function typedMatches(given, key) {
  var keys = [].concat.apply([], String(key == null ? "" : key).split("|").map(answerForms)).join("|");
  return answerForms(given).some(function (g) { return answerMatches(g, keys); });
}

  area.innerHTML = head + '<div class="q-kind">' + (tf ? "True or false?" : "Choose the correct answer") + "</div>" +
    '<h2 class="q-prompt' + (q.prompt.length > 90 ? " small" : "") + '">' + formatPrompt(q.prompt) + "</h2>" + (q.hint ? '<p class="hint">Hint: ' + esc(q.hint) + "</p>" : "") +
    '<div class="opts' + (two || tf ? " two" : "") + (tf ? " tf" : "") + '">' +
    shown.map(function (o, i) { return '<button type="button" class="opt" data-i="' + i + '">' + (tf ? "" : '<span class="k">' + (i + 1) + "</span>") + "<span>" + esc(o) + "</span></button>"; }).join("") + "</div>";
  var box = area.querySelector(".opts");
  box.addEventListener("click", function (e) {
    var b = e.target.closest(".opt"); if (!b || box.classList.contains("lock")) return;
    sel = Number(b.dataset.i); sfx("tap");
    box.querySelectorAll(".opt").forEach(function (x) { x.classList.toggle("sel", x === b); });
    setReady(true);
  });
  return {
    evaluate: function () {
      var ok = String(shown[sel]) === String(q.answer);
      box.classList.add("lock");
      box.querySelectorAll(".opt").forEach(function (x, i) {
        x.classList.remove("sel");
        if (String(shown[i]) === String(q.answer)) x.classList.add("right");
        else if (i === sel) x.classList.add("wrong");
      });
      return { ok: ok, correctText: q.answer };
    }
  };
}
function typed(q, area, setReady, head, isFix) {
  area.innerHTML = head + '<div class="q-kind">' + (isFix ? "Fix the mistake" : "Type the answer") + "</div>" +
    (isFix ? '<p class="lbl-s">This sentence has one mistake:</p><div class="wrongline">' + esc(q.prompt) + '</div><p class="lbl-s">Write the correct sentence:</p>'
      : '<h2 class="q-prompt' + (q.prompt.length > 90 ? " small" : "") + '">' + formatPrompt(q.prompt) + "</h2>" + (q.hint ? '<p class="hint">Hint: ' + esc(q.hint) + "</p>" : "")) +
    (isFix ? '<textarea class="answer-in" id="ans" rows="3" autocomplete="off" autocapitalize="sentences" spellcheck="false" aria-label="Your corrected sentence"></textarea>'
      : '<input class="answer-in" id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type here" aria-label="Your answer">');
  var inp = area.querySelector("#ans"); inp.value = isFix ? q.prompt : "";
  var chk = function () { var v = inp.value.trim(); setReady(v !== "" && (!isFix || normalize(v) !== normalize(q.prompt))); };
  inp.addEventListener("input", chk); chk();
  setTimeout(function () { try { inp.focus({ preventScroll: true }); if (isFix) inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {} }, 60);
  return {
    evaluate: function () {
      var ok = typedMatches(inp.value, q.answer);
      inp.readOnly = true; inp.classList.add(ok ? "right" : "wrong"); inp.blur();
      return { ok: ok, correctText: firstAnswer(q.answer) };
    }
  };
}
function tiles(q, area, setReady, isOrder) {
  var parts = isOrder ? (q.items || []) : firstAnswer(q.answer).trim().split(/\s+/);
  var items = parts.map(function (text, i) { return { id: i, text: text }; });
  var pool = shuffleNotSame(items), placed = [], locked = false;
  area.innerHTML = '<div class="q-kind">' + (isOrder ? "Put the sentences in order" : "Build the sentence") + "</div>" +
    '<h2 class="q-prompt small">' + (isOrder ? esc(q.prompt) : "Tap the words to make a sentence." + (q.prompt ? '<br><span style="color:var(--muted);font-size:17px">Focus: ' + esc(q.prompt) + "</span>" : "")) + "</h2>" +
    '<div class="tiles-target' + (isOrder ? " v" : "") + '" id="tt"></div><div class="tiles-pool' + (isOrder ? " v" : "") + '" id="tp"></div>';
  var tt = area.querySelector("#tt"), tp = area.querySelector("#tp");
  function tileHtml(t, where, num) { return '<button type="button" class="tile" data-id="' + t.id + '" data-w="' + where + '">' + (num ? '<span class="n">' + num + "</span>" : "") + "<span>" + esc(t.text) + "</span></button>"; }
  function draw() {
    tt.innerHTML = placed.length ? placed.map(function (t, i) { return tileHtml(t, "placed", isOrder ? i + 1 : 0); }).join("")
      : '<span class="ph">' + (isOrder ? "Tap the sentences below in the right order." : "Your sentence will appear here.") + "</span>";
    tp.innerHTML = pool.map(function (t) { return tileHtml(t, "pool", 0); }).join("");
    setReady(isOrder ? pool.length === 0 : placed.length > 0);
  }
  area.addEventListener("click", function (e) {
    if (locked) return;
    var b = e.target.closest(".tile"); if (!b) return;
    var id = Number(b.dataset.id), t;
    sfx("tap");
    if (b.dataset.w === "placed") { t = placed.filter(function (x) { return x.id === id; })[0]; placed = placed.filter(function (x) { return x.id !== id; }); pool.push(t); }
    else { t = pool.filter(function (x) { return x.id === id; })[0]; pool = pool.filter(function (x) { return x.id !== id; }); placed.push(t); }
    draw();
  });
  draw();
  return {
    evaluate: function () {
      locked = true;
      var ok = isOrder ? placed.length === items.length && placed.every(function (t, i) { return t.text === parts[i]; })
        : typedMatches(placed.map(function (t) { return t.text; }).join(" "), q.answer);
      tt.classList.add(ok ? "right" : "wrong");
      return { ok: ok, correctText: isOrder ? parts.map(function (p, i) { return (i + 1) + ". " + p; }).join("\n") : firstAnswer(q.answer) };
    }
  };
}
function matcher(q, area, setReady) {
  var pairs = q.pairs || [], idx = pairs.map(function (p, i) { return i; });
  var L1 = shuffle(idx), R1 = shuffleNotSame(idx);
  var link = {}; // left index -> right index
  var sel = null, locked = false;
  area.innerHTML = '<div class="q-kind">Match the pairs</div><h2 class="q-prompt small">' + esc(q.prompt || "Match the words.") + "</h2>" +
    '<p class="hint" style="margin-top:-6px">Tap a word on the left, then its partner on the right.</p><div class="match"><div class="col" id="ml"></div><div class="col" id="mr"></div></div>';
  var ml = area.querySelector("#ml"), mr = area.querySelector("#mr");
  function rightOwner(r) { for (var k in link) if (link[k] === r) return Number(k); return -1; }
  function colorOf(l) { return PAIR_COLORS[L1.indexOf(l) % PAIR_COLORS.length]; }
  function draw() {
    ml.innerHTML = L1.map(function (i) {
      var p = link[i] != null, s = sel && sel.side === "l" && sel.i === i;
      return '<button type="button" class="mt' + (s ? " sel" : "") + '" data-side="l" data-i="' + i + '"' + (p ? ' data-p="1" style="background:' + colorOf(i) + '"' : "") + ">" + esc(pairs[i].left) + "</button>";
    }).join("");
    mr.innerHTML = R1.map(function (j) {
      var o = rightOwner(j), s = sel && sel.side === "r" && sel.i === j;
      return '<button type="button" class="mt' + (s ? " sel" : "") + '" data-side="r" data-i="' + j + '"' + (o >= 0 ? ' data-p="1" style="background:' + colorOf(o) + '"' : "") + ">" + esc(pairs[j].right) + "</button>";
    }).join("");
    setReady(Object.keys(link).length === pairs.length);
  }
  area.querySelector(".match").addEventListener("click", function (e) {
    if (locked) return;
    var b = e.target.closest(".mt"); if (!b) return;
    var side = b.dataset.side, i = Number(b.dataset.i);
    sfx("tap");
    if (side === "l" && link[i] != null) { delete link[i]; sel = null; return draw(); }        // tap a pair again to undo it
    if (side === "r" && rightOwner(i) >= 0) { delete link[rightOwner(i)]; sel = null; return draw(); }
    if (!sel || sel.side === side) { sel = (sel && sel.side === side && sel.i === i) ? null : { side: side, i: i }; return draw(); }
    var l = side === "l" ? i : sel.i, r = side === "r" ? i : sel.i;
    link[l] = r; sel = null; draw();
  });
  draw();
  return {
    evaluate: function () {
      locked = true;
      var ok = pairs.every(function (p, i) { return link[i] === i; });
      ml.querySelectorAll(".mt").forEach(function (b) { var i = Number(b.dataset.i); b.classList.add(link[i] === i ? "ok" : "bad"); });
      mr.querySelectorAll(".mt").forEach(function (b) { var j = Number(b.dataset.i); b.classList.add(rightOwner(j) === j ? "ok" : "bad"); });
      return { ok: ok, correctText: pairs.map(function (p) { return p.left + " → " + p.right; }).join("\n") };
    }
  };
}

/* ================= start ================= */
$("#path").addEventListener("click", function (e) {
  var b = e.target.closest("[data-l]"); if (!b) return;
  var l = ORDER.filter(function (x) { return x.id === b.dataset.l; })[0];
  if (l) { sfx("tap"); lessonSheet(l); }
});
$("#snd").addEventListener("click", function () { S.sound = !S.sound; save(); renderStats(); if (S.sound) sfx("good"); });
$("#reset").addEventListener("click", function () {
  var sh = openSheet('<h3 style="margin-top:0">Start again?</h3><p>This deletes your lessons, XP and streak on this phone.</p>' +
    '<button class="btn red" data-a="yes">Yes, start again</button><button class="btn ghost" data-a="no">Cancel</button>', true);
  sh.addEventListener("click", function (e) {
    var b = e.target.closest("[data-a]"); if (!b) return;
    closeLayer();
    if (b.dataset.a === "yes") { var snd = S.sound; S = blank(); S.sound = snd; save(); renderPath(); window.scrollTo(0, 0); }
  });
});
renderPath();
requestAnimationFrame(function () { scrollToCurrent(false); });
</script>
